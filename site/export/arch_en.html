<!DOCTYPE html>

<body><div id="plate"><svg viewBox="0 0 1120 760" width="100%" role="img" aria-label="Overview of the Agentic three-layer architecture, control/data-plane split, and out-of-stack data subsystem" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision">
    <defs>

      <marker id="archArrowOrange" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">

    <text x="788" y="150" fill="#047857" font-size="17" font-weight="700">𝒟 = ⟨D₁,D₂,D₃,D₄,Ω⟩</text>

    <text x="707" y="264" fill="#059669" font-size="10.5" font-family="ui-monospace,Menlo,monospace">query</text>

    <text x="72" y="593" fill="#7C3AED" font-size="12" font-family="ui-monospace,Menlo,monospace" letter-spacing="1">UNIFIED INVARIANT</text>
    <text x="72" y="624" fill="#111827" font-size="17" font-weight="700">First-order cost of new capability lands on a plane / subsystem decoupled from the main request path</text>

    <rect x="72" y="646" width="226" height="48" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-opacity=".24"/>

    <text x="185" y="684" fill="#3B82F6" font-size="10.8" font-weight="600" text-anchor="middle">coverage 𝒯↑ · throughput unharmed</text>

    <rect x="564" y="646" width="226" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-opacity=".24"/>
    <text x="677" y="666" fill="#059669" font-size="12.5" font-weight="700" text-anchor="middle">Data scaling → 𝓛₂</text>
    <text x="677" y="684" fill="#059669" font-size="10.8" font-weight="600" text-anchor="middle">more sources · per-request cost flat</text>
    <rect x="810" y="646" width="238" height="48" rx="10" fill="#FEFCE8" stroke="#CA8A04" stroke-opacity=".26"/>

    <text x="929" y="684" fill="#CA8A04" font-size="10.8" font-weight="600" text-anchor="middle">ρ↓ · H↑ · summary-only</text>

    <text x="72" y="732" fill="#86868b" font-size="11.5" font-family="ui-monospace,Menlo,monospace">P1-P3: scaling axes · P4-P6: CP/DP · P7-P9: 𝒟 · P10-P13: parallel locality · P14: Skill-as-Code determinism anchor · P15: dual-subgoal reward training.</text>
