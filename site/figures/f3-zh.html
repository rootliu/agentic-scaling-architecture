<body><div id="p"><svg viewBox="0 0 1200 860" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision"><defs>

    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#EA580C"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker><marker id="k" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B7280"/></marker>
  </defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="54" y="52" text-anchor="start" font-size="22" font-weight="700" fill="#111827">Agent 是怎么工作的 — 分步走查</text><text x="54" y="80" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">Harness 运行这个循环。由 LLM 做选择；typed contract、policy gate 与 verifier 保证它安全、不跑偏。</text><rect x="300" y="108" width="520" height="58" rx="13" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><circle cx="330" cy="137" r="16" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="330" y="138" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="360" y="132" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">读懂目标</text><text x="360" y="150" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">读取用户的请求与约束；想清楚“做完”长什么样。</text><rect x="300" y="180" width="520" height="58" rx="13" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><circle cx="330" cy="209" r="16" fill="#3B82F6" stroke="#fff" stroke-width="2"/><text x="330" y="210" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="360" y="204" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">挑选 skill</text><text x="360" y="222" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">选出合适的 SkillSpec，加载它的输入/输出 schema。</text><rect x="300" y="252" width="520" height="58" rx="13" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><circle cx="330" cy="281" r="16" fill="#059669" stroke="#fff" stroke-width="2"/><text x="330" y="282" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="360" y="276" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">收集上下文</text><text x="360" y="294" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">拉入记忆、相关示例（shots）和工具的契约。</text><rect x="300" y="324" width="520" height="58" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.7" opacity="1"/><circle cx="330" cy="353" r="16" fill="#7C3AED" stroke="#fff" stroke-width="2"/><text x="330" y="354" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="360" y="348" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">制定计划</text><text x="360" y="366" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">LLM 起草带 fallback 和明确停止条件的计划。</text><rect x="300" y="396" width="520" height="58" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.7" opacity="1"/><circle cx="330" cy="425" r="16" fill="#7C3AED" stroke="#fff" stroke-width="2"/><text x="330" y="426" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">5</text><text x="360" y="420" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">选择下一步动作</text><text x="360" y="438" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">为这一步选 tool（O1）、模型（O7）和 token 预算（O8）。</text><rect x="300" y="468" width="520" height="58" rx="13" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><circle cx="330" cy="497" r="16" fill="#7C3AED" stroke="#fff" stroke-width="2"/><text x="330" y="498" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">6</text><text x="360" y="492" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">先检查，再执行</text><text x="360" y="510" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">policy gate 校验范围与权限，然后在 Scaffold 执行 / 查询</text><text x="360" y="523" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280"> Data。</text><rect x="300" y="540" width="520" height="58" rx="13" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><circle cx="330" cy="569" r="16" fill="#7C3AED" stroke="#fff" stroke-width="2"/><text x="330" y="570" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">7</text><text x="360" y="564" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">观察并打分</text><text x="360" y="582" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">收集结果与证据；verifier / reward 给它打分。</text><rect x="300" y="612" width="520" height="58" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.7" opacity="1"/><circle cx="330" cy="641" r="16" fill="#EA580C" stroke="#fff" stroke-width="2"/><text x="330" y="642" text-anchor="middle" dominant-baseline="middle" font-size="15" font-weight="800" fill="#fff">8</text><text x="360" y="636" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">够好了吗？</text><text x="360" y="654" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">够好 → 交付结果。   不够 → 反思、修订计划，回到第 5 步。</text><path d="M560 166 L560 180" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 238 L560 252" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 310 L560 324" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 382 L560 396" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 454 L560 468" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 526 L560 540" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M560 598 L560 612" fill="none" stroke="#7C3AED" stroke-width="1.9" marker-end="url(#a)"/><path d="M150 137 L300 137" fill="none" stroke="#6B7280" stroke-width="1.6" marker-end="url(#k)"/><text x="144" y="127" text-anchor="start" font-size="13" font-weight="400" fill="#111827"></text><rect x="874" y="428" width="270" height="86" rx="13" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" opacity="1" filter="url(#sh)"/><text x="892" y="452" text-anchor="start" font-size="14" font-weight="800" fill="#C2410C">Scaffold</text><text x="892" y="472" text-anchor="start" font-size="10.8" font-weight="400" fill="#C2410C">sandbox · shell · serving</text><text x="892" y="490" text-anchor="start" font-size="10.8" font-weight="400" fill="#C2410C">filesystem · network · SSO/cloud</text><rect x="874" y="530" width="270" height="86" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" opacity="1" filter="url(#sh)"/><text x="892" y="554" text-anchor="start" font-size="14" font-weight="800" fill="#047857">数据子系统 𝒟</text><text x="892" y="574" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">D₁/D₂ 查询 · D₃/D₄ 策略</text><text x="892" y="592" text-anchor="start" font-size="10.8" font-weight="400" fill="#6B7280">Ω workspace 证据</text><path d="M820 489 L874 471" fill="none" stroke="#EA580C" stroke-width="1.8" marker-end="url(#o)"/><path d="M820 505 L845 505 L845 573 L874 573" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#t)"/><rect x="874" y="612" width="270" height="58" rx="13" fill="#eaf7f0" stroke="#3B82F6" stroke-width="1.5" opacity="1"/><text x="1009" y="641" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="800" fill="#1E40AF">交付产物</text><path d="M820 641 L874 641" fill="none" stroke="#3B82F6" stroke-width="1.9" marker-end="url(#g)"/><path d="M300 641 L150 641 L150 425 L300 425" fill="none" stroke="#EA580C" stroke-width="1.9" stroke-dasharray="6 5" marker-end="url(#o)"/><text x="158" y="504" text-anchor="start" font-size="10.5" font-weight="700" fill="#EA580C">反思并回到第 5 步</text><rect x="300" y="708" width="844" height="48" rx="12" fill="#F9FAFB" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="6 6" opacity="1"/><text x="318" y="737" text-anchor="start" font-size="11.5" font-weight="400" fill="#5B21B6">在后台静默运行：System skills (M) 在步骤之间做记忆压缩、写回与检索。</text></svg></div></body></html>
