<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<style>@page{size:1200px 860px;margin:0}html,body{margin:0;padding:0;background:#FFFFFF}#p{width:1200px;height:860px}#p svg{display:block;width:1200px;height:860px}</style></head>
<body><div id="p"><svg viewBox="0 0 1200 860" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision"><defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".05"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#EA580C"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker><marker id="k" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B7280"/></marker>
  </defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="54" y="52" text-anchor="start" font-size="22" font-weight="700" fill="#111827">三个层 — 每一层是干什么的</text><text x="54" y="80" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">第一眼认识：一个 AI agent 由三个层叠起来，旁边再加一个数据子系统。</text><rect x="56" y="112" width="740" height="172" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.7" opacity="1" filter="url(#sh)"/><rect x="74" y="130" width="52" height="30" rx="8" fill="#fff" stroke="#3B82F6" stroke-width="1.4" opacity="1"/><text x="100" y="151" text-anchor="middle" font-size="16" font-weight="800" fill="#1E40AF">L3</text><text x="142" y="151" text-anchor="start" font-size="17" font-weight="800" fill="#1E40AF">Skills  —  “要做什么”</text><text x="80" y="186" text-anchor="start" font-size="12.5" font-weight="400" fill="#1E40AF">存放任务的“岗位说明书”：目标、输入/输出格式，</text><text x="80" y="205" text-anchor="start" font-size="12.5" font-weight="400" fill="#1E40AF">以及何时行动、何时停止、何时循环的规则。</text><text x="80" y="238" text-anchor="start" font-size="12" font-weight="700" fill="#3B82F6">就像员工的工作手册 / SOP。</text><rect x="74" y="250" width="704" height="24" rx="7" fill="#fff" stroke="#3B82F6" stroke-width="1" opacity="0.85"/><text x="84" y="267" text-anchor="start" font-size="11.5" font-weight="700" fill="#1E40AF">加一个 Skill → 多一种能做的任务（逻辑扩展）</text><rect x="56" y="300" width="740" height="172" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.7" opacity="1" filter="url(#sh)"/><rect x="74" y="318" width="52" height="30" rx="8" fill="#fff" stroke="#7C3AED" stroke-width="1.4" opacity="1"/><text x="100" y="339" text-anchor="middle" font-size="16" font-weight="800" fill="#5B21B6">L2</text><text x="142" y="339" text-anchor="start" font-size="17" font-weight="800" fill="#5B21B6">Harness  —  “怎么把活干成”</text><text x="80" y="374" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B21B6">把 Skill 的意图翻译成可执行的步骤。管理记忆、上下文、</text><text x="80" y="393" text-anchor="start" font-size="12.5" font-weight="400" fill="#5B21B6">工具、代码生成、安全检查与审计日志。</text><text x="80" y="426" text-anchor="start" font-size="12" font-weight="700" fill="#7C3AED">就像项目经理 + 运行时框架。</text><rect x="74" y="438" width="704" height="24" rx="7" fill="#fff" stroke="#7C3AED" stroke-width="1" opacity="0.85"/><text x="84" y="455" text-anchor="start" font-size="11.5" font-weight="700" fill="#5B21B6">Skills 与 Scaffold 唯一相遇的地方（解耦点）</text><rect x="56" y="488" width="740" height="172" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.7" opacity="1" filter="url(#sh)"/><rect x="74" y="506" width="52" height="30" rx="8" fill="#fff" stroke="#EA580C" stroke-width="1.4" opacity="1"/><text x="100" y="527" text-anchor="middle" font-size="16" font-weight="800" fill="#C2410C">L1</text><text x="142" y="527" text-anchor="start" font-size="17" font-weight="800" fill="#C2410C">Scaffold  —  “在哪里安全地跑”</text><text x="80" y="562" text-anchor="start" font-size="12.5" font-weight="400" fill="#C2410C">提供隔离的执行环境：sandbox、shell、网络、存储</text><text x="80" y="581" text-anchor="start" font-size="12.5" font-weight="400" fill="#C2410C">与模型 serving 算力，并带安全边界。</text><text x="80" y="614" text-anchor="start" font-size="12" font-weight="700" fill="#EA580C">就像一台安全的云电脑。</text><rect x="74" y="626" width="704" height="24" rx="7" fill="#fff" stroke="#EA580C" stroke-width="1" opacity="0.85"/><text x="84" y="643" text-anchor="start" font-size="11.5" font-weight="700" fill="#C2410C">加一个实例 → 多一份吞吐（物理扩展）</text><path d="M756 284 L756 300" fill="none" stroke="#7C3AED" stroke-width="2.1" marker-end="url(#a)"/><path d="M756 472 L756 488" fill="none" stroke="#EA580C" stroke-width="2.1" marker-end="url(#o)"/><rect x="820" y="112" width="324" height="548" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="1.7" opacity="1" filter="url(#sh)"/><text x="842" y="146" text-anchor="start" font-size="16" font-weight="800" fill="#047857">数据子系统 𝒟</text><text x="842" y="170" text-anchor="start" font-size="11.5" font-weight="400" fill="#6B7280">agent 对你数据的认知（放在一旁，主要离线</text><text x="842" y="186" text-anchor="start" font-size="11.5" font-weight="400" fill="#6B7280">）</text><text x="844" y="230" font-size="11.5" fill="#059669" font-weight="700">›</text><text x="859" y="230" font-size="11.5" fill="#047857">D₁  取数 — 按需只读你要的那一片</text><text x="844" y="254" font-size="11.5" fill="#059669" font-weight="700">›</text><text x="859" y="254" font-size="11.5" fill="#047857">D₂  语义总结 — 离线把数据源预消化</text><text x="844" y="278" font-size="11.5" fill="#059669" font-weight="700">›</text><text x="859" y="278" font-size="11.5" fill="#047857">D₃  治理记忆 — 记住“该怎么用这份数据”</text><text x="844" y="302" font-size="11.5" fill="#059669" font-weight="700">›</text><text x="859" y="302" font-size="11.5" fill="#047857">D₄  lifetime — 时新性、口径与成本预算</text><text x="844" y="326" font-size="11.5" fill="#059669" font-weight="700">›</text><text x="859" y="326" font-size="11.5" fill="#047857">Ω   工作区 — 运行历史、产物、LLM wiki</text><rect x="56" y="672" width="1088" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.3" stroke-dasharray="7 6" opacity="1"/><text x="80" y="706" text-anchor="start" font-size="13.5" font-weight="600" fill="#111827">关键点：每一种增长（更多 skill / 更多机器 / 更多数据）加在不同的轴上，因此互不拖累。</text></svg></div></body></html>
