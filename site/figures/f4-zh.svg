<svg viewBox="0 0 1200 860" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision"><defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".05"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#EA580C"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker><marker id="k" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B7280"/></marker>
  </defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="54" y="52" text-anchor="start" font-size="22" font-weight="700" fill="#111827">Code 即契约 — Harness 如何把 Plan 变成行动</text><text x="54" y="80" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">LLM 写编排代码（概率性）；runtime 运行它（确定、可审计）。这段被生成的代码，就是所谓的“确定性内核”。</text><rect x="70" y="118" width="470" height="560" rx="16" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="6 5" opacity="1"/><rect x="660" y="118" width="470" height="560" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3" stroke-dasharray="6 5" opacity="1"/><text x="90" y="144" text-anchor="start" font-size="12" font-weight="800" fill="#5B21B6">概率性 — LLM 生成</text><text x="680" y="144" text-anchor="start" font-size="12" font-weight="800" fill="#C2410C">确定性 — runtime 执行</text><rect x="100" y="168" width="410" height="66" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><text x="118" y="194" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">Plan</text><text x="118" y="214" text-anchor="start" font-size="10.6" font-weight="400" fill="#6B7280">NL 子目标 DAG · 验收靠 PRD</text><rect x="100" y="272" width="410" height="66" rx="12" fill="#fff" stroke="#7C3AED" stroke-width="1.2" opacity="1"/><text x="118" y="298" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">工具 fan-out</text><text x="118" y="318" text-anchor="start" font-size="10.6" font-weight="400" fill="#6B7280">每个子目标多个候选调用（LLM 驱动）</text><rect x="100" y="376" width="410" height="66" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.7" opacity="1"/><text x="118" y="402" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">生成编排代码</text><text x="118" y="422" text-anchor="start" font-size="10.6" font-weight="400" fill="#6B7280">dispatch + 子 agent 依赖图</text><path d="M305 234 L305 272" fill="none" stroke="#7C3AED" stroke-width="2.1" marker-end="url(#a)"/><path d="M305 338 L305 376" fill="none" stroke="#7C3AED" stroke-width="2.1" marker-end="url(#a)"/><rect x="690" y="168" width="410" height="152" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.3" opacity="1"/><text x="708" y="194" text-anchor="start" font-size="13.5" font-weight="800" fill="#C2410C">子 agent 并行执行</text><text x="708" y="214" text-anchor="start" font-size="10.6" font-weight="400" fill="#C2410C">在 Scaffold（隔离）</text><text x="708" y="242" text-anchor="start" font-size="10.6" font-weight="800" fill="#111827">派生 sub-agent = 三问：</text><circle cx="712" cy="257" r="4" fill="#EA580C"/><text x="722" y="260" text-anchor="start" font-size="10" font-weight="800" fill="#EA580C">在哪 / 资源：</text><text x="813" y="260" text-anchor="start" font-size="10" font-weight="400" fill="#6B7280">启动 = Scaffold fork —— 新 CPU / 隔离（+X）</text><circle cx="712" cy="274" r="4" fill="#7C3AED"/><text x="722" y="277" text-anchor="start" font-size="10" font-weight="800" fill="#7C3AED">跑什么：</text><text x="769" y="277" text-anchor="start" font-size="10" font-weight="400" fill="#6B7280">已有工具 · 或 T8 现编程序</text><circle cx="712" cy="291" r="4" fill="#059669"/><text x="722" y="294" text-anchor="start" font-size="10" font-weight="800" fill="#059669">接线：</text><text x="758" y="294" text-anchor="start" font-size="10" font-weight="400" fill="#6B7280">N6 code-loop 派发 + 依赖</text><rect x="690" y="354" width="410" height="66" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.7" opacity="1"/><text x="708" y="380" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">verify + 筛选</text><text x="708" y="400" text-anchor="start" font-size="10.6" font-weight="400" fill="#6B7280">保留最优候选；可重放 trace</text><path d="M895 320 L895 354" fill="none" stroke="#EA580C" stroke-width="2.1" marker-end="url(#o)"/><path d="M510 409 L600 409 L600 201 L690 201" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#a)"/><text x="566" y="399" text-anchor="start" font-size="11" font-weight="800" fill="#5B21B6" font-family="ui-monospace,Menlo,monospace">code</text><path d="M690 387 L620 387 L620 104 L305 104 L305 168" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="300" y="98" text-anchor="start" font-size="10.5" font-weight="700" fill="#EA580C">不够好 → 修订 plan</text><rect x="70" y="700" width="1060" height="52" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4" opacity="1"/><text x="88" y="722" text-anchor="start" font-size="13" font-weight="800" fill="#1E40AF">Skill = 结晶的 code-loop</text><text x="88" y="740" text-anchor="start" font-size="11" font-weight="400" fill="#3B82F6">shots + 因果 trace + reward → integrated tool，跨用户共享</text><path d="M895 420 L895 700" fill="none" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#g)"/><text x="907" y="560" text-anchor="start" font-size="10" font-weight="400" fill="#1E40AF">reward-gated → 结晶</text><rect x="70" y="762" width="1060" height="38" rx="11" fill="#F9FAFB" stroke="#7C3AED" stroke-width="1.2" stroke-dasharray="6 6" opacity="1"/><text x="600" y="781" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#5B21B6">Skill ⊥ Harness — 只通过 code-loop 耦合，两侧各自迭代</text></svg>