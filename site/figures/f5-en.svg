<svg viewBox="0 0 1200 860" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" text-rendering="geometricPrecision"><defs>
    <filter id="sh" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity=".05"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7C3AED"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#EA580C"/></marker><marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker><marker id="k" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6B7280"/></marker>
  </defs><rect width="1200" height="860" fill="#FFFFFF"/><text x="54" y="52" text-anchor="start" font-size="22" font-weight="700" fill="#111827">Eight Kinds of Tool — One Capsule Interface</text><text x="54" y="80" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">The Harness is not just “a bag of tools”. All eight kinds expose the SAME intent + I/O contract to the LLM; they differ only in implementation and governance.</text><rect x="70" y="116" width="1060" height="48" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6" opacity="1"/><text x="600" y="140" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="800" fill="#5B21B6">CapabilityCapsule — intent + I/O contract (what the LLM sees)</text><rect x="70" y="176" width="1060" height="32" rx="9" fill="#fbfaf6" stroke="#E5E7EB" stroke-width="1.2" opacity="1"/><text x="600" y="192" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#6B7280">O1 tool selection · intent-scoped top-k over all 8 kinds</text><path d="M600 208 L600 236" fill="none" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#a)"/><rect x="57" y="244" width="258" height="116" rx="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="83" cy="270" r="15" fill="#3B82F6"/><text x="83" y="271" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T1</text><text x="107" y="275" text-anchor="start" font-size="13" font-weight="800" fill="#1E40AF">Standard tool</text><text x="75" y="304" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">web search · fetch · calculator · code</text><text x="75" y="319" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">exec</text><rect x="333" y="244" width="258" height="116" rx="13" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="359" cy="270" r="15" fill="#EA580C"/><text x="359" y="271" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T2</text><text x="383" y="275" text-anchor="start" font-size="13" font-weight="800" fill="#C2410C">Model tool</text><text x="351" y="304" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">fine-tuned OCR · classifier · embedding</text><text x="351" y="319" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">· rerank</text><rect x="609" y="244" width="258" height="116" rx="13" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="635" cy="270" r="15" fill="#7C3AED"/><text x="635" y="271" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T3</text><text x="659" y="275" text-anchor="start" font-size="13" font-weight="800" fill="#5B21B6">Crystallized skill</text><text x="627" y="304" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">reusable, skill-verified code-loop (N7)</text><rect x="885" y="244" width="258" height="116" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="911" cy="270" r="15" fill="#059669"/><text x="911" y="271" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T4</text><text x="935" y="275" text-anchor="start" font-size="13" font-weight="800" fill="#047857">Data-theme query</text><text x="903" y="304" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">ext: TianYanCha · GitHub · arXiv / int:</text><text x="903" y="319" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">roster · org · quota · territory</text><rect x="57" y="382" width="258" height="116" rx="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="83" cy="408" r="15" fill="#7C3AED"/><text x="83" y="409" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T5</text><text x="107" y="413" text-anchor="start" font-size="13" font-weight="800" fill="#5B21B6">Harness meta-tool</text><text x="75" y="442" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">compact · recap · writeback · retrieve</text><text x="75" y="457" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">· fork (LLM-invoked)</text><rect x="333" y="382" width="258" height="116" rx="13" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="359" cy="408" r="15" fill="#EA580C"/><text x="359" y="409" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T6</text><text x="383" y="413" text-anchor="start" font-size="13" font-weight="800" fill="#C2410C">Scaffold command</text><text x="351" y="442" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">bash · file (read/write/edit) · process</text><text x="351" y="457" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">· network</text><rect x="609" y="382" width="258" height="116" rx="13" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="635" cy="408" r="15" fill="#16A34A"/><text x="635" y="409" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T7</text><text x="659" y="413" text-anchor="start" font-size="13" font-weight="800" fill="#15803D">Human-in-the-loop</text><text x="627" y="442" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">ask · confirm · approve — human as a</text><text x="627" y="457" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">callable capability</text><rect x="885" y="382" width="258" height="116" rx="13" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" opacity="1" filter="url(#sh)"/><circle cx="911" cy="408" r="15" fill="#7C3AED"/><text x="911" y="409" text-anchor="middle" dominant-baseline="middle" font-size="12.5" font-weight="800" fill="#fff">T8</text><text x="935" y="413" text-anchor="start" font-size="13" font-weight="800" fill="#5B21B6">Ephemeral code tool</text><text x="903" y="442" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">LLM writes a program on the fly (O5) —</text><text x="903" y="457" text-anchor="start" font-size="10.4" font-weight="400" fill="#6B7280">not yet crystallized</text><rect x="70" y="518" width="1060" height="68" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2" stroke-dasharray="6 6" opacity="1"/><text x="90" y="540" text-anchor="start" font-size="11.5" font-weight="400" fill="#111827">T8 → T3: an on-the-fly generated tool becomes a reusable skill after verify + reward-gate + generalization. Deriving a sub-agent is not a tool kind: LAUNCHING it</text><text x="90" y="556" text-anchor="start" font-size="11.5" font-weight="400" fill="#111827">is a Scaffold interface (fork = new CPU/isolation, +X); what it runs is existing tools or a T8 program; N6 code-loop dispatches. New vs. prior enums: T2</text><text x="90" y="572" text-anchor="start" font-size="11.5" font-weight="400" fill="#111827">(model-as-tool) &amp; T5 (LLM-invoked maintenance).</text></svg>