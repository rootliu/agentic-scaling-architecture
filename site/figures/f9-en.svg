  </defs><rect width="1200" height="980" fill="#FFFFFF"/><text x="54" y="50" text-anchor="start" font-size="21" font-weight="700" fill="#111827">Data Wiki Construction — Automated Regular Sources + Human-Agent Complex Reports</text><text x="54" y="76" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">D2 lineage: regular sources are auto read+summarized by the off-policy loop; complex</text><text x="54" y="95" text-anchor="start" font-size="13" font-weight="400" fill="#6B7280">reports (multi-sheet/drifting definitions) are built with humans and validated via reflection.</text><text x="54" y="128" text-anchor="start" font-size="13" font-weight="800" fill="#047857">① Regular sources (databases/APIs/logs)</text><rect x="54" y="144" width="200" height="66" rx="8" fill="#fff" stroke="#E5E7EB" stroke-width="1.2" opacity="1" filter="url(#sh)"/><text x="70" y="170" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Data source src</text><text x="70" y="190" text-anchor="start" font-size="10" font-weight="400" fill="#6B7280">structured/semi-structured</text><text x="70" y="205" text-anchor="start" font-size="10" font-weight="400" fill="#6B7280">programmatically accessible</text><path d="M254 177 L326 177" fill="none" stroke="#059669" stroke-width="2.1" marker-end="url(#a)"/><rect x="326" y="144" width="300" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.7" opacity="1" filter="url(#sh)"/><text x="342" y="170" text-anchor="start" font-size="13" font-weight="800" fill="#047857">D2 off-policy loop: read</text><text x="342" y="190" text-anchor="start" font-size="10" font-weight="400" fill="#047857">search structure/content/latent-fields</text><text x="342" y="205" text-anchor="start" font-size="10" font-weight="400" fill="#047857">(async batch, off the main request path)</text><path d="M476 210 L476 242" fill="none" stroke="#059669" stroke-width="2.1" marker-end="url(#a)"/><rect x="54" y="244" width="706" height="110" rx="8" f