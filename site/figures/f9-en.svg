troke="#0284C7" stroke-width="1.8" marker-end="url(#a)"/><text x="700" y="648" text-anchor="start" font-size="10.6" font-weight="700" fill="#0369A1">Pass → write into Data Wiki</text><path d="M538 627 L538 568 L820 568 L820 481 L780 481" fill="none" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="836" y="518" text-anchor="middle" dominant-baseline="middle" font-size="9.6" font-weight="700" fill="#991B1B" transform="rotate(-90 836 518)">Fail → back to spec for more detail</text><path d="M476 354 L476 372 L20 372 L20 764 L130 764" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="3 4" marker-end="url(#a)"/><rect x="54" y="778" width="1092" height="120" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" opacity="1" filter="url(#sh)"/><text x="72" y="808" text-anchor="start" font-size="13.5" font-weight="800" fill="#5B21B6">Data Wiki (accumulates long-term, incremental, queried via semantic join)</text><rect x="74" y="828" width="150" height="46" rx="9" fill="#fff" stroke="#059669" stroke-width="1.4" opacity="1"/><text x="149" y="852" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#047857">Σ(src₁)</text><rect x="240" y="836" width="150" height="46" rx="9" fill="#fff" stroke="#059669" stroke-width="1.4" opacity="1"/><text x="315" y="860" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#047857">Σ(src₂)</text><rect x="406" y="826" width="180" height="46" rx="9" fill="#fff" stroke="#EA580C" stroke-width="1.4" opacity="1"/><text x="496" y="850" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#C2410C">Report spec + reference</text><rect x="602" y="838" width="150" height="46" rx="9" fill="#fff" stroke="#059669" stroke-width="1.4" opacity="1"/><text x="677" y="862" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#047857">Σ(src₃)</text><rect x="768" y="828" wi